{% extends 'dashboard/base.html' %}
{% block title %}Delete Product | Owner Dashboard{% endblock %}

{% block dashboard_content %}
<div class="glass-panel" style="padding:40px;background:#ffffff;max-width:500px;margin:40px auto;text-align:center">
  <div style="font-size:48px;margin-bottom:16px">⚠️</div>
  <h2 style="font:700 28px Fraunces,serif;margin:0 0 12px">Delete Product?</h2>
  <p style="color:var(--muted);margin-bottom:24px">Are you sure you want to permanently delete <b>"{{ product.name }}"</b>? This action cannot be undone.</p>

  <form method="post" style="display:flex;gap:12px;justify-content:center">
    {% csrf_token %}
    <button type="submit" class="button button-dark" style="background:#dc2626">Yes, Delete Permanently 🗑️</button>
    <a href="{% url 'dashboard:product_list' %}" class="button button-light">Cancel</a>
  </form>
</div>
{% endblock %}
