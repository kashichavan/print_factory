{% comment %}
Owner Dashboard Sidebar Navigation Component — The Print Planet
{% endcomment %}
<aside class="side glass-panel" style="padding:20px;border-radius:14px;background:#ffffff;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(15,23,42,0.03)">
  <div style="margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #f1f5f9">
    <span style="font-size:10px;letter-spacing:1.5px;font-weight:800;color:#2563eb;text-transform:uppercase">COMMAND CENTER</span>
    <h3 style="font:700 18px 'Plus Jakarta Sans', sans-serif;margin:4px 0 0;color:#0f172a;letter-spacing:-0.3px">Control Hub</h3>
  </div>

  <nav style="display:flex;flex-direction:column;gap:4px">
    <a href="{% url 'dashboard:home' %}" class="dash-nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
      Overview Dashboard
    </a>
    <a href="{% url 'dashboard:product_list' %}" class="dash-nav-item {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
      Product Catalog
    </a>
    <a href="{% url 'dashboard:service_list' %}" class="dash-nav-item {% if 'service' in request.resolver_match.url_name %}active{% endif %}">
      Production Services
    </a>
    <a href="{% url 'dashboard:order_list' %}" class="dash-nav-item {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
      Orders &amp; Jobs
    </a>
    <a href="{% url 'dashboard:lead_list' %}" class="dash-nav-item {% if 'lead' in request.resolver_match.url_name %}active{% endif %}">
      Customer Leads
    </a>
    <a href="{% url 'dashboard:product_create' %}" class="dash-nav-item" style="color:#2563eb;font-weight:700;margin-top:8px">
      Create Product
    </a>
  </nav>

  <div style="margin-top:32px;padding-top:16px;border-top:1px solid #f1f5f9">
    <form method="post" action="{% url 'dashboard:logout' %}">
      {% csrf_token %}
      <button class="button button-dark" style="width:100%;justify-center;font-size:13px;padding:9px 14px;background:#0f172a;border-radius:8px">
        Sign Out
      </button>
    </form>
  </div>
</aside>
